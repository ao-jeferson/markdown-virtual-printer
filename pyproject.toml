[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdprint"
version = "0.1.0"
description = "Convert documents and print jobs into structured Markdown"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "mdprint contributors"}]
dependencies = []

[project.optional-dependencies]
html = ["markdownify>=0.13,<2"]
dev = ["build>=1.2", "ruff>=0.8"]

[project.scripts]
mdprint = "mdprint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
