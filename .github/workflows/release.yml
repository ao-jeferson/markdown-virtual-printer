name: Build release artifacts

on:
  pull_request:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            features: desktop-ui,unix-printer
          - os: macos-latest
            platform: macos-arm64
            features: desktop-ui,unix-printer
          - os: windows-2022
            platform: windows-x86_64
            features: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - if: matrix.features != ''
        run: cargo build --release -p printer-core --features ${{ matrix.features }} --lib --bins
      - if: matrix.features == ''
        run: cargo build --release -p printer-core --lib
      - if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $passwordText = [guid]::NewGuid().ToString('N')
          $password = ConvertTo-SecureString -String $passwordText -AsPlainText -Force
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Markdown Virtual Printer' -KeyUsage DigitalSignature -FriendlyName 'Markdown Virtual Printer release signing' -CertStoreLocation 'Cert:\CurrentUser\My'
          $pfx = Join-Path $env:RUNNER_TEMP 'mdvp-signing.pfx'
          Export-PfxCertificate -Cert $certificate -FilePath $pfx -Password $password | Out-Null
          $cer = Join-Path $env:RUNNER_TEMP 'mdvp-publisher.cer'
          Export-Certificate -Cert $certificate -FilePath $cer | Out-Null
          msbuild platforms/windows/MarkdownVirtualPrinter.csproj /restore /p:Configuration=Release /p:Platform=x64 /p:OutputPath=bin\Release\x64\ /p:RuntimeIdentifiers=win10 /p:AppxPackageSigningEnabled=true /p:UapAppxPackageBuildMode=Sideload /p:GenerateAppxPackageOnBuild=true /p:PackageCertificateKeyFile="$pfx" /p:PackageCertificatePassword=$passwordText /p:PackageCertificateThumbprint=$($certificate.Thumbprint) /p:_NetCoreFrameworkInjectionNeeded=false
          $package = Get-ChildItem platforms/windows -Recurse -Filter '*.msix' | Select-Object -First 1
          if (-not $package) { throw 'MSBuild did not produce an MSIX package.' }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item $package.FullName package/MarkdownVirtualPrinter.msix
          Copy-Item $cer package/MarkdownVirtualPrinter.cer
          Copy-Item platforms/windows/Package.appxmanifest package/AppxManifest.xml
          Copy-Item packaging/windows/Install-MarkdownVirtualPrinter.ps1 package/Install-MarkdownVirtualPrinter.ps1
          Compress-Archive -Path package/* -DestinationPath mdvp-${{ matrix.platform }}.zip -Force
      - if: runner.os == 'Linux'
        run: |
          mkdir -p package-root
          cp target/release/libprinter_core.so package-root/
          cp target/release/mdvp-agent package-root/
          cp target/release/mdvp-cups-backend package-root/
          cp packaging/cups/MarkdownVirtualPrinter.ppd package-root/
          bash packaging/linux/build-deb.sh "$GITHUB_REF_NAME" "$PWD/package-root"
          tar -czf mdvp-${{ matrix.platform }}.tar.gz \
            target/release/libprinter_core.so target/release/libprinter_core.rlib \
            target/release/mdvp-agent target/release/mdvp-cups-backend \
            packaging/linux/install.sh packaging/cups/MarkdownVirtualPrinter.ppd
          mv package-root/out/*.deb .
      - if: runner.os == 'macOS'
        run: |
          mkdir -p package-root
          cp target/release/libprinter_core.dylib package-root/
          cp target/release/mdvp-agent package-root/
          cp target/release/mdvp-cups-backend package-root/
          cp packaging/cups/MarkdownVirtualPrinter.ppd package-root/
          bash packaging/macos/build-pkg.sh "$GITHUB_REF_NAME" "$PWD/package-root"
          mv package-root/out/*.pkg .
          tar -czf mdvp-${{ matrix.platform }}.tar.gz target/release/libprinter_core.dylib target/release/libprinter_core.rlib target/release/mdvp-agent target/release/mdvp-cups-backend
      - uses: actions/upload-artifact@v4
        with:
          name: mdvp-${{ matrix.platform }}
          path: mdvp-${{ matrix.platform }}.*
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
