name: Build release artifacts

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            features: desktop-ui,unix-printer
          - os: macos-latest
            platform: macos-arm64
            features: desktop-ui,unix-printer
          - os: windows-2022
            platform: windows-x86_64
            features: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - if: matrix.features != ''
        run: cargo build --release -p printer-core --features ${{ matrix.features }} --lib --bins
      - if: matrix.features == ''
        run: cargo build --release -p printer-core --lib
      - if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $passwordText = [guid]::NewGuid().ToString('N')
          $password = ConvertTo-SecureString -String $passwordText -AsPlainText -Force
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Markdown Virtual Printer' -KeyUsage DigitalSignature -FriendlyName 'Markdown Virtual Printer release signing' -CertStoreLocation 'Cert:\CurrentUser\My'
          $pfx = Join-Path $env:RUNNER_TEMP 'mdvp-signing.pfx'
          Export-PfxCertificate -Cert $certificate -FilePath $pfx -Password $password | Out-Null
          $cer = Join-Path $env:RUNNER_TEMP 'mdvp-publisher.cer'
          Export-Certificate -Cert $certificate -FilePath $cer | Out-Null
          msbuild platforms/windows/MarkdownVirtualPrinter.csproj /restore /p:Configuration=Release /p:Platform=x64 /p:OutputPath=bin\Release\x64\ /p:RuntimeIdentifiers=win10 /p:AppxPackageSigningEnabled=false /p:AppxPackage=false /p:GenerateAppxPackageOnBuild=false
          $stage = Join-Path $env:RUNNER_TEMP 'mdvp-msix'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item platforms/windows/bin/Release/x64/* $stage -Recurse -Force
          Copy-Item platforms/windows/Assets $stage -Recurse -Force
          Copy-Item platforms/windows/Config $stage -Recurse -Force
          $manifest = Join-Path $stage 'AppxManifest.xml'
          $manifestText = (Get-Content platforms/windows/Package.appxmanifest -Raw).Replace('$targetnametoken$.exe', 'MarkdownVirtualPrinter.exe')
          [System.IO.File]::WriteAllText($manifest, $manifestText, [System.Text.UTF8Encoding]::new($false))
          $makeAppx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter MakeAppx.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeAppx) { throw 'Windows SDK MakeAppx.exe was not found.' }
          $signtool = Join-Path $makeAppx.DirectoryName 'signtool.exe'
          if (-not (Test-Path -LiteralPath $signtool)) { throw 'Windows SDK signtool.exe was not found.' }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          & $makeAppx.FullName pack /d $stage /p package/MarkdownVirtualPrinter.msix /o
          if ($LASTEXITCODE -ne 0) { throw 'MakeAppx failed to create the MSIX package.' }
          & $signtool sign /fd SHA256 /f $pfx /p $passwordText package/MarkdownVirtualPrinter.msix
          if ($LASTEXITCODE -ne 0) { throw 'SignTool failed to sign the MSIX package.' }
          Copy-Item $cer package/MarkdownVirtualPrinter.cer
          Copy-Item platforms/windows/Package.appxmanifest package/AppxManifest.xml
          Copy-Item packaging/windows/Install-MarkdownVirtualPrinter.ps1 package/Install-MarkdownVirtualPrinter.ps1
          Compress-Archive -Path package/* -DestinationPath mdvp-${{ matrix.platform }}.zip -Force
      - if: runner.os == 'Linux'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/printer-core/Cargo.toml | head -n1)"
          mkdir -p package-root
          cp target/release/libprinter_core.so package-root/
          cp target/release/mdvp-agent package-root/
          cp target/release/mdvp-cups-backend package-root/
          cp packaging/cups/MarkdownVirtualPrinter.ppd package-root/
          bash packaging/linux/build-deb.sh "$VERSION" "$PWD/package-root"
          tar -czf mdvp-${{ matrix.platform }}.tar.gz \
            target/release/libprinter_core.so target/release/libprinter_core.rlib \
            target/release/mdvp-agent target/release/mdvp-cups-backend \
            packaging/linux/install.sh packaging/cups/MarkdownVirtualPrinter.ppd
          mv package-root/out/*.deb mdvp-${{ matrix.platform }}.deb
      - if: runner.os == 'macOS'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/printer-core/Cargo.toml | head -n1)"
          mkdir -p package-root
          cp target/release/libprinter_core.dylib package-root/
          cp target/release/mdvp-agent package-root/
          cp target/release/mdvp-cups-backend package-root/
          cp packaging/cups/MarkdownVirtualPrinter.ppd package-root/
          bash packaging/macos/build-pkg.sh "v$VERSION" "$PWD/package-root"
          mv package-root/out/*.pkg mdvp-${{ matrix.platform }}.pkg
          tar -czf mdvp-${{ matrix.platform }}.tar.gz target/release/libprinter_core.dylib target/release/libprinter_core.rlib target/release/mdvp-agent target/release/mdvp-cups-backend
      - uses: actions/upload-artifact@v4
        with:
          name: mdvp-${{ matrix.platform }}
          path: mdvp-${{ matrix.platform }}.*
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
