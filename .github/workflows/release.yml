name: Build release artifacts

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            features: desktop-ui,unix-printer
          - os: macos-latest
            platform: macos-arm64
            features: desktop-ui,unix-printer
          - os: windows-2022
            platform: windows-x86_64
            features: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - if: matrix.features != ''
        run: cargo build --release -p printer-core --features ${{ matrix.features }} --lib --bins
      - if: matrix.features == ''
        run: cargo build --release -p printer-core --lib
      - if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          msbuild platforms/windows/MarkdownVirtualPrinter.csproj /restore /p:Configuration=Release /p:Platform=x64 /p:OutputPath=bin\Release\x64\ /p:RuntimeIdentifiers=win10 /p:AppxPackageSigningEnabled=false /p:UapAppxPackageBuildMode=Sideload /p:AppxPackage=false /p:GenerateAppxPackageOnBuild=false
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/printer_core.dll platforms/windows/bin/Release/x64/printer_core.dll
          Compress-Archive -Path platforms/windows/bin/Release/x64/* -DestinationPath mdvp-${{ matrix.platform }}.zip -Force
      - if: runner.os == 'Linux'
        run: |
          tar -czf mdvp-${{ matrix.platform }}.tar.gz \
            target/release/libprinter_core.so target/release/libprinter_core.rlib \
            target/release/mdvp-agent target/release/mdvp-cups-backend \
            packaging/linux/install.sh packaging/cups/MarkdownVirtualPrinter.ppd
      - if: runner.os == 'macOS'
        run: tar -czf mdvp-${{ matrix.platform }}.tar.gz target/release/libprinter_core.dylib target/release/libprinter_core.rlib target/release/mdvp-agent target/release/mdvp-cups-backend
      - uses: actions/upload-artifact@v4
        with:
          name: mdvp-${{ matrix.platform }}
          path: mdvp-${{ matrix.platform }}.*
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
